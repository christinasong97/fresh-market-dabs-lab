# Promotion: develop -> int, main -> cert -> (approval) -> prod.
# Every deploy runs as the CI/CD service principal; no person deploys to a shared environment.
# Off until the repository variable DATABRICKS_CI_ENABLED is set to 'true' (the runner must be
# able to reach the workspace; FEVM's IP access list blocks GitHub-hosted runners).
name: Deploy

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}

jobs:
  int:
    name: Deploy to int
    if: vars.DATABRICKS_CI_ENABLED == 'true' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: int
    env:
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate --strict -t int
      - run: databricks bundle deploy -t int --auto-approve

  cert:
    name: Deploy to cert + integration test
    if: vars.DATABRICKS_CI_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: cert
    env:
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate --strict -t cert
      - run: databricks bundle deploy -t cert --auto-approve
      - name: Integration test (run the orchestrator end to end)
        run: databricks bundle run so_orchestrator -t cert

  prod:
    name: Deploy to prod
    needs: cert
    runs-on: ubuntu-latest
    # Required reviewers on the prod environment make this the approval gate.
    environment: prod
    env:
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate --strict -t prod
      - run: databricks bundle deploy -t prod --auto-approve
