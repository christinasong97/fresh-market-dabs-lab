# Runs on every pull request. Nothing reaches develop or main without passing these checks.
name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  checks:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit and bundle rule tests
        run: pytest tests/unit tests/bundle -v

  validate:
    name: Bundle validate (${{ matrix.target }})
    needs: checks
    # Needs network access to the workspace. Off until DATABRICKS_CI_ENABLED is set to 'true'.
    # Pull requests from forks get no credentials, so they always stop after the offline checks.
    if: vars.DATABRICKS_CI_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: ci
    strategy:
      matrix:
        target: [int, cert, prod]
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate --strict -t ${{ matrix.target }}
