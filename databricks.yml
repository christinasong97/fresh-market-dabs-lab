# Root bundle: targets, includes, workspace config.
# Owned by DevOps / platform (see .github/CODEOWNERS). Developers add files under
# resources/ and src/; they should not need to edit this file.
bundle:
  name: fresh_market_dabs_lab
  engine: direct # Required for genie_spaces; also no Terraform dependency.

include:
  # resources/*.yml, resources/<type>/*.yml, and resources/<type>/<domain>/*.yml
  - resources/*.yml
  - resources/*/*.yml
  - resources/*/*/*.yml

# No workspace host is pinned: the workspace UI deploys to the workspace you're in, and CI sets
# DATABRICKS_HOST. That lets the same bundle run in FEVM, Vocareum, or Free Edition.
#
# Development mode prefixes names, pauses schedules, and isolates each developer's copy.
# Production-mode targets below deploy as the CI/CD service principal only.
targets:
  dev:
    mode: development
    default: true
    variables:
      environment: dev
      catalog: fresh_market_lab_int

  int:
    mode: production
    workspace:
      root_path: /Workspace/Users/${var.cicd_service_principal}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.cicd_service_principal}
    permissions:
      - level: CAN_MANAGE
        service_principal_name: ${var.cicd_service_principal}
      - level: CAN_VIEW
        group_name: users
    variables:
      environment: int
      catalog: fresh_market_lab_int

  cert:
    mode: production
    workspace:
      root_path: /Workspace/Users/${var.cicd_service_principal}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.cicd_service_principal}
    permissions:
      - level: CAN_MANAGE
        service_principal_name: ${var.cicd_service_principal}
      - level: CAN_VIEW
        group_name: users
    variables:
      environment: cert
      catalog: fresh_market_lab_cert

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${var.cicd_service_principal}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.cicd_service_principal}
    permissions:
      - level: CAN_MANAGE
        service_principal_name: ${var.cicd_service_principal}
      - level: CAN_VIEW
        group_name: users
    variables:
      environment: prod
      catalog: fresh_market_lab_prod
