[tool.ruff]
line-length = 130
target-version = "py311"
# Databricks notebooks and pipeline modules get spark, dbutils, display injected at runtime.
builtins = ["spark", "dbutils", "display", "displayHTML"]
extend-exclude = ["devops/lab_setup"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Module notebooks use names defined by %run ./_lab_helpers, and import inside cells.
"lab/*.py" = ["F821", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["expectations", "store_kpi_logic"]
